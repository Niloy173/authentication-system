spring:
  application:
    name: authentication

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: 8081

app:
  frontend:
    base-url: http://localhost:3000
  mail:
    enabled: true
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 15
  token:
    expiry-minutes: 5
    max-attempts: 3


logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}